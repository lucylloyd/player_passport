<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privacy Notice – Player Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --turf: #0B3D62;
    --chalk: #F4F7FA;
    --chalk-dim: #C9D6E2;
    --amber: #F2A93B;
    --muted: #6B7C8C;
    --border: rgba(11,61,98,0.12);
    --border-soft: rgba(11,61,98,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #EDF1F5;
    color: var(--turf);
  }
  .font-display { font-family: 'Oswald', 'Inter', sans-serif; }
  .shell {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--chalk);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  }
  .topbar {
    background: var(--turf);
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    color: var(--chalk);
  }
  .back:active { transform: scale(0.98); }
  .topbar h1 {
    color: var(--chalk);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .topbar p { color: var(--chalk-dim); font-size: 12px; margin: 2px 0 0; }
  main { padding: 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
  }
  .doc { font-size: 14px; line-height: 1.6; }
  .doc h2 {
    font-family: 'Oswald', 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .doc h3 { font-size: 14px; font-weight: 700; margin: 16px 0 6px; }
  .doc p { margin: 0 0 10px; }
  .doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc > section > :last-child { margin-bottom: 0; }
  .doc a { color: var(--turf); font-weight: 600; }
  .doc .intro { color: var(--muted); }
  .table-wrap { overflow-x: auto; margin: 4px 0 12px; border: 1px solid var(--border); border-radius: 10px; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.45; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--border-soft); }
  .doc th { background: rgba(11,61,98,0.05); font-weight: 600; white-space: nowrap; }
  .doc tr:last-child td { border-bottom: none; }
  .status { color: var(--muted); font-size: 14px; text-align: center; padding: 40px 16px; }
  footer { padding: 4px 16px 28px; text-align: center; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="back" href="../" aria-label="Back to Player Passport">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <h1 class="font-display">PRIVACY NOTICE</h1>
      <p id="updated">Player Passport</p>
    </div>
  </header>
  <main>
    <div id="doc" class="doc"><p class="status">Loading…</p></div>
    <noscript><p class="status">This page needs JavaScript. You can read the <a href="../privacyPP.md">plain-text privacy notice</a> instead.</p></noscript>
  </main>
  <footer><a href="../">Back to Player Passport</a></footer>
</div>
<script>
/* =========================================================
   The notice text lives in /privacyPP.md — edit that file only.
   This page fetches it and renders the small Markdown subset it
   uses: # headings, paragraphs, **bold**, *italic*, [links](url),
   - / 1. lists and | tables |. Email addresses are linked.
========================================================= */
const SOURCE = "../privacyPP.md";

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function inline(text) {
  const links = [];
  const stash = html => "\u0000" + (links.push(html) - 1) + "\u0000";
  let s = esc(text)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) =>
      /^(https?:|mailto:|\/|\.|#)/i.test(url) ? stash(`<a href="${url}">${label}</a>`) : label)
    .replace(/\b[\w.+-]+@[\w-]+(\.[\w-]+)+\b/g, m => stash(`<a href="mailto:${m}">${m}</a>`))
    .replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:)]/g, m => stash(`<a href="${m}">${m}</a>`))
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => links[i]);
}

const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
const isRule = row => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(row);

function render(md) {
  const lines = md.replace(/\r\n?/g, "\n").split("\n");
  const out = { title: "", updated: "", intro: [], sections: [] };
  let current = null;
  const target = () => current ? current.html : out.intro;
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(/^#\s+(.*)/))) { out.title = m[1].trim(); i++; continue; }
    if ((m = line.match(/^##\s+(.*)/))) {
      current = { html: [`<h2>${inline(m[1])}</h2>`] };
      out.sections.push(current);
      i++; continue;
    }
    if ((m = line.match(/^#{3,6}\s+(.*)/))) { target().push(`<h3>${inline(m[1])}</h3>`); i++; continue; }
    if (line.trim().startsWith("|") && lines[i + 1] && isRule(lines[i + 1])) {
      const head = cells(line);
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) body.push(cells(lines[i++]));
      target().push('<div class="table-wrap"><table><thead><tr>' +
        head.map(h => `<th scope="col">${inline(h)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const tag = /^\s*\d+\./.test(line) ? "ol" : "ul";
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      target().push(`<${tag}>${items.join("")}</${tag}>`);
      continue;
    }
    let para = line.trim();
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#|\||\s*([-*]|\d+\.)\s)/.test(lines[i])) para += " " + lines[i++].trim();
    // The "Last updated" line is shown in the header, as the notice promises
    if ((m = para.match(/^last updated:?\s*(.*)$/i))) { out.updated = m[1]; continue; }
    target().push(`<p>${inline(para)}</p>`);
  }
  return out;
}

fetch(SOURCE, { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    const doc = render(md);
    if (doc.title) document.title = doc.title;
    document.getElementById("updated").textContent = doc.updated ? "Last updated: " + doc.updated : "Player Passport";
    const intro = doc.intro.length ? `<section class="card intro">${doc.intro.join("")}</section>` : "";
    document.getElementById("doc").innerHTML = intro +
      doc.sections.map(s => `<section class="card">${s.html.join("")}</section>`).join("");
  })
  .catch(() => {
    document.getElementById("doc").innerHTML =
      `<p class="status">Couldn't load the privacy notice. You can read the <a href="${SOURCE}">plain-text version</a> instead.</p>`;
  });
</script>
</body>
</html>
