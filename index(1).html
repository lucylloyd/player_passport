<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Touchline — Skill Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  :root {
    --turf: #0B3D62;
    --chalk: #F4F7FA;
    --chalk-dim: #C9D6E2;
    --amber: #F2A93B;
    --border: rgba(11,61,98,0.12);
    --border-soft: rgba(11,61,98,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #EDF1F5;
  }
  .font-display { font-family: 'Oswald', 'Inter', sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  textarea { font-family: inherit; }
  textarea:focus { outline: none; border-color: var(--turf) !important; }
  .press:active { transform: scale(0.98); }
  .truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roster-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .roster-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------------- Inline icons (no external icon library needed) ---------------- */
const Icon = ({ children, size = 16, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {children}
  </svg>
);
const ArrowLeft = (p) => <Icon {...p}><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></Icon>;
const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
const UserRound = (p) => <Icon {...p}><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><path d="M9 18l6-6-6-6" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6L9 17l-5-5" /></Icon>;
const MessageSquarePlus = (p) => <Icon {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><path d="M12 7v6" /><path d="M9 10h6" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></Icon>;
const ShieldHalf = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="M12 22V2" /></Icon>;

/* ---------------------------------------------------------
   TOUCHLINE — a field hockey skill development tracker
   Prototype: in-memory data only, no backend.
   Styling: plain inline styles / CSS, no framework dependency.
--------------------------------------------------------- */

const TOKENS = {
  turf: "#0B3D62",
  chalk: "#F4F7FA",
  chalkDim: "#C9D6E2",
  amber: "#F2A93B",
};

const LEVELS = [
  { value: 1, label: "Introducing", short: "Intro", color: "#8FA3B3" },
  { value: 2, label: "Developing", short: "Devlp", color: "#3E8BD6" },
  { value: 3, label: "Competent", short: "Compt", color: "#2FB6A3" },
  { value: 4, label: "Expert", short: "Expert", color: "#F2A93B" },
];

const SQUADS = ["U12", "U14", "U16", "Senior"];

const SKILLS_BY_CATEGORY = {
  U12: ["Dribbling with control", "Push pass", "Stopping the ball", "Basic tackle", "Moving into space", "Shot on goal"],
  U14: ["Reverse stick pick up", "Block tackle", "Push pass", "Hit", "Moving into space", "Shot on goal"],
  U16: ["Reverse stick pick up", "Jab tackle", "Aerial pass", "Hit", "Drag flick", "Moving into space"],
  Senior: ["Reverse stick pick up", "Jab tackle", "Aerial pass", "Drag flick", "3D ball lift", "Press & cover"],
};

const NAMES = [
  { name: "Freya Douglas", age: 11, category: "U12" },
  { name: "Callum Reid", age: 12, category: "U12" },
  { name: "Amelia Fraser", age: 13, category: "U14" },
  { name: "Ryan MacKenzie", age: 14, category: "U14" },
  { name: "Isla Grant", age: 14, category: "U14" },
  { name: "Lewis Anderson", age: 15, category: "U16" },
  { name: "Ellie Cameron", age: 16, category: "U16" },
  { name: "Jack Sutherland", age: 16, category: "U16" },
  { name: "Katie Robertson", age: 19, category: "Senior" },
  { name: "Euan Wallace", age: 22, category: "Senior" },
];

const SEED_DATES = ["28 Jun 2026", "15 May 2026", "02 Apr 2026"];

function seedScores(category, idx) {
  const skills = SKILLS_BY_CATEGORY[category];
  const scores = {};
  skills.forEach((skill, i) => {
    const startLevel = 1 + ((idx + i) % 3);
    const current = Math.min(4, startLevel + 1);
    scores[skill] = {
      value: current,
      history: [{ value: startLevel, date: SEED_DATES[(idx + i) % SEED_DATES.length] }],
    };
  });
  return scores;
}

function makePlayers() {
  return NAMES.map((p, idx) => ({
    id: `p${idx}`,
    ...p,
    scores: seedScores(p.category, idx),
    feedback: idx % 3 === 0 ? [{ date: "05 Jul 2026", note: "Strong composure under pressure in the D. Keep working reverse-stick control at speed." }] : [],
  }));
}

function today() {
  return new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function levelFor(v) {
  return LEVELS.find((l) => l.value === v) || LEVELS[0];
}

/* ---------------- Shared bits ---------------- */

function TopBar({ title, subtitle, onBack }) {
  return (
    <div style={{
      background: TOKENS.turf, position: "sticky", top: 0, zIndex: 10,
      padding: "20px 16px 16px", borderBottom: "1px solid rgba(255,255,255,0.08)",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        {onBack && (
          <button
            onClick={onBack}
            className="press"
            style={{
              flexShrink: 0, width: 36, height: 36, borderRadius: 999, border: "none",
              display: "flex", alignItems: "center", justifyContent: "center",
              background: "rgba(255,255,255,0.08)", color: TOKENS.chalk,
              transition: "transform 0.1s ease",
            }}
            aria-label="Go back"
          >
            <ArrowLeft size={18} />
          </button>
        )}
        <div style={{ minWidth: 0 }}>
          <h1 className="font-display truncate" style={{
            color: TOKENS.chalk, fontWeight: 700, fontSize: 20, letterSpacing: "0.02em", margin: 0,
          }}>
            {title}
          </h1>
          {subtitle && (
            <p className="truncate" style={{ color: TOKENS.chalkDim, fontSize: 12, margin: "2px 0 0" }}>
              {subtitle}
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

function SegmentBar({ value }) {
  return (
    <div style={{ display: "flex", gap: 4 }} aria-hidden="true">
      {LEVELS.map((l) => (
        <div
          key={l.value}
          style={{
            height: 8, flex: 1, borderRadius: 2,
            background: l.value <= value ? levelFor(value).color : "rgba(11,61,98,0.12)",
            transition: "background-color 0.15s ease",
          }}
        />
      ))}
    </div>
  );
}

const sectionLabelStyle = { fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", fontWeight: 600, color: TOKENS.turf, opacity: 0.6, margin: 0 };
const cardBase = { borderRadius: 12, border: "1px solid var(--border)", background: "#fff" };

/* ---------------- Landing screen ---------------- */

function Landing({ tab, setTab, onOpenSquad, onOpenPlayer }) {
  return (
    <div>
      <TopBar title="TOUCHLINE" subtitle="Skill development tracker" />
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", borderRadius: 12, overflow: "hidden", border: "1px solid rgba(11,61,98,0.15)", marginBottom: 20 }}>
          {["squad", "player"].map((t) => (
            <button
              key={t}
              onClick={() => setTab(t)}
              style={{
                flex: 1, padding: "12px 0", fontSize: 14, fontWeight: 600, letterSpacing: "0.02em",
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                border: "none", background: tab === t ? TOKENS.turf : TOKENS.chalk,
                color: tab === t ? TOKENS.chalk : TOKENS.turf, transition: "background-color 0.15s ease",
              }}
            >
              {t === "squad" ? <Users size={16} /> : <UserRound size={16} />}
              {t === "squad" ? "By squad" : "By player"}
            </button>
          ))}
        </div>

        {tab === "squad" ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <p style={sectionLabelStyle}>Choose a squad</p>
            {SQUADS.map((sq) => (
              <button
                key={sq}
                onClick={() => onOpenSquad(sq)}
                className="press"
                style={{
                  ...cardBase, width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "16px", transition: "transform 0.1s ease",
                }}
              >
                <div style={{ textAlign: "left" }}>
                  <div className="font-display" style={{ fontWeight: 700, fontSize: 18, color: TOKENS.turf }}>{sq}</div>
                  <div style={{ fontSize: 12, marginTop: 2, color: "#6B7C8C" }}>
                    {NAMES.filter((n) => n.category === sq).length} players · {SKILLS_BY_CATEGORY[sq].length} core skills
                  </div>
                </div>
                <ChevronRight size={20} style={{ color: TOKENS.amber }} />
              </button>
            ))}
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <p style={{ ...sectionLabelStyle, marginBottom: 12 }}>All players</p>
            {NAMES.map((p, idx) => (
              <button
                key={idx}
                onClick={() => onOpenPlayer(`p${idx}`)}
                className="press"
                style={{
                  ...cardBase, width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "12px 16px", transition: "transform 0.1s ease",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left" }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 12, fontWeight: 700, flexShrink: 0, background: TOKENS.turf, color: TOKENS.chalk,
                  }}>
                    {p.name.split(" ").map((w) => w[0]).join("")}
                  </div>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 14, color: TOKENS.turf }}>{p.name}</div>
                    <div style={{ fontSize: 12, color: "#6B7C8C" }}>{p.category} · age {p.age}</div>
                  </div>
                </div>
                <ChevronRight size={18} style={{ color: "#B9C6D1" }} />
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Squad detail screen ---------------- */

function SquadDetail({ squad, players, onBack, onOpenPlayer }) {
  const roster = players.filter((p) => p.category === squad);
  const skills = SKILLS_BY_CATEGORY[squad];

  return (
    <div>
      <TopBar title={`${squad} squad`} subtitle={`${roster.length} players`} onBack={onBack} />
      <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 24 }}>
        <div>
          <p style={{ ...sectionLabelStyle, marginBottom: 8 }}>Skills to master</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {skills.map((s) => (
              <span
                key={s}
                style={{
                  fontSize: 12, fontWeight: 500, padding: "6px 12px", borderRadius: 999,
                  border: "1px solid rgba(11,61,98,0.2)", color: TOKENS.turf, background: "#fff",
                }}
              >
                {s}
              </span>
            ))}
          </div>
        </div>

        <div>
          <p style={{ ...sectionLabelStyle, marginBottom: 8 }}>Roster</p>
          <div className="roster-grid">
            {roster.map((p) => {
              const avg =
                Object.values(p.scores).reduce((a, s) => a + s.value, 0) / Object.values(p.scores).length;
              return (
                <button
                  key={p.id}
                  onClick={() => onOpenPlayer(p.id)}
                  className="press"
                  style={{ ...cardBase, padding: 16, textAlign: "left", transition: "transform 0.1s ease" }}
                >
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                    <div style={{ fontWeight: 600, fontSize: 14, color: TOKENS.turf }}>{p.name}</div>
                    <span style={{
                      fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 999,
                      background: levelFor(Math.round(avg)).color, color: "#fff",
                    }}>
                      {levelFor(Math.round(avg)).short}
                    </span>
                  </div>
                  <div style={{ fontSize: 12, marginBottom: 8, color: "#6B7C8C" }}>age {p.age}</div>
                  <SegmentBar value={Math.round(avg)} />
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Player detail screen ---------------- */

function PlayerDetail({ player, onBack, onScoreChange, onAddFeedback }) {
  const [editingSkill, setEditingSkill] = useState(null);
  const [note, setNote] = useState("");
  const skills = SKILLS_BY_CATEGORY[player.category];

  return (
    <div>
      <TopBar title={player.name} subtitle={`${player.category} · age ${player.age}`} onBack={onBack} />
      <div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 24 }}>
        <div>
          <p style={{ ...sectionLabelStyle, marginBottom: 8 }}>Skills</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {skills.map((skill) => {
              const rec = player.scores[skill];
              const lvl = levelFor(rec.value);
              const isEditing = editingSkill === skill;
              return (
                <div key={skill} style={{ ...cardBase, overflow: "hidden" }}>
                  <button
                    onClick={() => setEditingSkill(isEditing ? null : skill)}
                    style={{
                      width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
                      padding: "12px 16px", border: "none", background: "transparent",
                    }}
                  >
                    <div style={{ textAlign: "left", flex: 1, minWidth: 0, marginRight: 12 }}>
                      <div className="truncate" style={{ fontWeight: 600, fontSize: 14, color: TOKENS.turf }}>{skill}</div>
                      <div style={{ marginTop: 8 }}><SegmentBar value={rec.value} /></div>
                    </div>
                    <span style={{
                      fontSize: 12, fontWeight: 700, padding: "4px 10px", borderRadius: 999,
                      flexShrink: 0, background: lvl.color, color: "#fff",
                    }}>
                      {lvl.label}
                    </span>
                  </button>

                  {isEditing && (
                    <div style={{ padding: "4px 16px 16px", borderTop: "1px solid var(--border-soft)" }}>
                      <p style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", margin: "12px 0 8px", color: "#6B7C8C" }}>
                        Set new score
                      </p>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
                        {LEVELS.map((l) => (
                          <button
                            key={l.value}
                            onClick={() => {
                              onScoreChange(player.id, skill, l.value);
                              setEditingSkill(null);
                            }}
                            style={{
                              borderRadius: 8, padding: "8px 0", fontSize: 12, fontWeight: 600,
                              display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                              border: `1px solid ${l.value === rec.value ? l.color : "rgba(11,61,98,0.15)"}`,
                              background: l.value === rec.value ? l.color : "#fff",
                              color: l.value === rec.value ? "#fff" : TOKENS.turf,
                              transition: "background-color 0.15s ease",
                            }}
                          >
                            {l.value === rec.value && <Check size={12} />}
                            {l.label}
                          </button>
                        ))}
                      </div>

                      {rec.history.length > 0 && (
                        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 4 }}>
                          <p style={{ fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em", margin: 0, color: "#6B7C8C" }}>
                            History
                          </p>
                          {rec.history.slice().reverse().map((h, i) => (
                            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "#6B7C8C" }}>
                              <Clock size={11} />
                              <span>{h.date} — scored {levelFor(h.value).label}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <p style={{ ...sectionLabelStyle, marginBottom: 8 }}>Game feedback</p>
          <div style={{ ...cardBase, padding: 16 }}>
            <textarea
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="What stood out this game? What should they focus on next?"
              rows={3}
              style={{
                width: "100%", fontSize: 14, borderRadius: 8, border: "1px solid rgba(11,61,98,0.15)",
                padding: 12, resize: "none",
              }}
            />
            <button
              onClick={() => {
                if (!note.trim()) return;
                onAddFeedback(player.id, note.trim());
                setNote("");
              }}
              className="press"
              style={{
                marginTop: 8, display: "flex", alignItems: "center", gap: 8, fontSize: 14, fontWeight: 600,
                padding: "8px 12px", borderRadius: 8, border: "none", background: TOKENS.turf, color: TOKENS.chalk,
                transition: "transform 0.1s ease",
              }}
            >
              <MessageSquarePlus size={15} /> Add feedback
            </button>

            {player.feedback.length > 0 && (
              <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 12 }}>
                {player.feedback.slice().reverse().map((f, i) => (
                  <div key={i} style={{ paddingLeft: 12, borderLeft: `2px solid ${TOKENS.amber}` }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7C8C" }}>{f.date}</div>
                    <div style={{ fontSize: 14, marginTop: 2, color: TOKENS.turf }}>{f.note}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div style={{ borderRadius: 12, padding: 16, display: "flex", gap: 12, alignItems: "flex-start", background: "rgba(242,169,59,0.12)" }}>
          <ShieldHalf size={18} style={{ color: TOKENS.amber, flexShrink: 0, marginTop: 2 }} />
          <p style={{ fontSize: 12, lineHeight: 1.6, margin: 0, color: TOKENS.turf }}>
            Focus next: skills sitting at <strong>Introducing</strong> or <strong>Developing</strong> are the priority
            for next session. Scores update instantly here — in the full build, this write goes through the
            permissioned API so only this player's coaches and admins can change it.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Root app ---------------- */

function TouchlineApp() {
  const [players, setPlayers] = useState(makePlayers);
  const [screen, setScreen] = useState("landing");
  const [tab, setTab] = useState("squad");
  const [selectedSquad, setSelectedSquad] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [cameFrom, setCameFrom] = useState("landing");

  const handleScoreChange = (playerId, skill, newValue) => {
    setPlayers((prev) =>
      prev.map((p) => {
        if (p.id !== playerId) return p;
        const rec = p.scores[skill];
        if (rec.value === newValue) return p;
        return {
          ...p,
          scores: {
            ...p.scores,
            [skill]: {
              value: newValue,
              history: [...rec.history, { value: rec.value, date: today() }],
            },
          },
        };
      })
    );
  };

  const handleAddFeedback = (playerId, note) => {
    setPlayers((prev) =>
      prev.map((p) =>
        p.id === playerId ? { ...p, feedback: [...p.feedback, { date: today(), note }] } : p
      )
    );
  };

  const openSquad = (sq) => {
    setSelectedSquad(sq);
    setScreen("squad");
  };

  const openPlayer = (id, from) => {
    setSelectedPlayerId(id);
    setCameFrom(from || screen);
    setScreen("player");
  };

  const selectedPlayer = players.find((p) => p.id === selectedPlayerId);

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", justifyContent: "center", background: "#EDF1F5" }}>
      <div style={{ width: "100%", maxWidth: 448, minHeight: "100vh", background: TOKENS.chalk, boxShadow: "0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1)" }}>
        {screen === "landing" && (
          <Landing
            tab={tab}
            setTab={setTab}
            onOpenSquad={openSquad}
            onOpenPlayer={(id) => openPlayer(id, "landing")}
          />
        )}
        {screen === "squad" && (
          <SquadDetail
            squad={selectedSquad}
            players={players}
            onBack={() => setScreen("landing")}
            onOpenPlayer={(id) => openPlayer(id, "squad")}
          />
        )}
        {screen === "player" && selectedPlayer && (
          <PlayerDetail
            player={selectedPlayer}
            onBack={() => setScreen(cameFrom === "squad" ? "squad" : "landing")}
            onScoreChange={handleScoreChange}
            onAddFeedback={handleAddFeedback}
          />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TouchlineApp />);
</script>
</body>
</html>
