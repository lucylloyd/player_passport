<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Touchline — Skill Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  body { margin: 0; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Oswald', 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------------- Inline icons (no external icon library needed) ---------------- */
const Icon = ({ children, size = 16, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {children}
  </svg>
);
const ArrowLeft = (p) => <Icon {...p}><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></Icon>;
const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
const UserRound = (p) => <Icon {...p}><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><path d="M9 18l6-6-6-6" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6L9 17l-5-5" /></Icon>;
const MessageSquarePlus = (p) => <Icon {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /><path d="M12 7v6" /><path d="M9 10h6" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></Icon>;
const ShieldHalf = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="M12 22V2" /></Icon>;

/* ---------------------------------------------------------
   TOUCHLINE — a field hockey skill development tracker
   Prototype: in-memory data only, no backend.
--------------------------------------------------------- */

const TOKENS = {
  turf: "#0B3D62",
  turfDeep: "#082B47",
  turfLight: "#13548C",
  chalk: "#F4F7FA",
  chalkDim: "#C9D6E2",
  amber: "#F2A93B",
  coral: "#E8604C",
};

const LEVELS = [
  { value: 1, label: "Introducing", short: "Intro", color: "#8FA3B3" },
  { value: 2, label: "Developing", short: "Devlp", color: "#3E8BD6" },
  { value: 3, label: "Competent", short: "Compt", color: "#2FB6A3" },
  { value: 4, label: "Expert", short: "Expert", color: "#F2A93B" },
];

const SQUADS = ["U12", "U14", "U16", "Senior"];

const SKILLS_BY_CATEGORY = {
  U12: ["Dribbling with control", "Push pass", "Stopping the ball", "Basic tackle", "Moving into space", "Shot on goal"],
  U14: ["Reverse stick pick up", "Block tackle", "Push pass", "Hit", "Moving into space", "Shot on goal"],
  U16: ["Reverse stick pick up", "Jab tackle", "Aerial pass", "Hit", "Drag flick", "Moving into space"],
  Senior: ["Reverse stick pick up", "Jab tackle", "Aerial pass", "Drag flick", "3D ball lift", "Press & cover"],
};

const NAMES = [
  { name: "Freya Douglas", age: 11, category: "U12" },
  { name: "Callum Reid", age: 12, category: "U12" },
  { name: "Amelia Fraser", age: 13, category: "U14" },
  { name: "Ryan MacKenzie", age: 14, category: "U14" },
  { name: "Isla Grant", age: 14, category: "U14" },
  { name: "Lewis Anderson", age: 15, category: "U16" },
  { name: "Ellie Cameron", age: 16, category: "U16" },
  { name: "Jack Sutherland", age: 16, category: "U16" },
  { name: "Katie Robertson", age: 19, category: "Senior" },
  { name: "Euan Wallace", age: 22, category: "Senior" },
];

const SEED_DATES = ["28 Jun 2026", "15 May 2026", "02 Apr 2026"];

function seedScores(category, idx) {
  const skills = SKILLS_BY_CATEGORY[category];
  const scores = {};
  skills.forEach((skill, i) => {
    const startLevel = 1 + ((idx + i) % 3);
    const current = Math.min(4, startLevel + 1);
    scores[skill] = {
      value: current,
      history: [{ value: startLevel, date: SEED_DATES[(idx + i) % SEED_DATES.length] }],
    };
  });
  return scores;
}

function makePlayers() {
  return NAMES.map((p, idx) => ({
    id: `p${idx}`,
    ...p,
    scores: seedScores(p.category, idx),
    feedback: idx % 3 === 0 ? [{ date: "05 Jul 2026", note: "Strong composure under pressure in the D. Keep working reverse-stick control at speed." }] : [],
  }));
}

function today() {
  return new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function levelFor(v) {
  return LEVELS.find((l) => l.value === v) || LEVELS[0];
}

/* ---------------- Shared bits ---------------- */

function TopBar({ title, subtitle, onBack }) {
  return (
    <div style={{ background: TOKENS.turf }} className="sticky top-0 z-10 px-4 pt-5 pb-4 border-b">
      <div className="flex items-center gap-3">
        {onBack && (
          <button
            onClick={onBack}
            className="shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition-colors"
            style={{ background: "rgba(255,255,255,0.08)", color: TOKENS.chalk }}
            aria-label="Go back"
          >
            <ArrowLeft size={18} />
          </button>
        )}
        <div className="min-w-0">
          <h1
            className="font-display text-xl tracking-wide truncate"
            style={{ color: TOKENS.chalk, fontWeight: 700, letterSpacing: "0.02em" }}
          >
            {title}
          </h1>
          {subtitle && (
            <p className="text-xs mt-0.5 truncate" style={{ color: TOKENS.chalkDim }}>
              {subtitle}
            </p>
          )}
        </div>
      </div>
    </div>
  );
}

function SegmentBar({ value }) {
  return (
    <div className="flex gap-1" aria-hidden="true">
      {LEVELS.map((l) => (
        <div
          key={l.value}
          className="h-2 flex-1 rounded-sm transition-colors"
          style={{ background: l.value <= value ? levelFor(value).color : "rgba(11,61,98,0.12)" }}
        />
      ))}
    </div>
  );
}

/* ---------------- Landing screen ---------------- */

function Landing({ tab, setTab, onOpenSquad, onOpenPlayer }) {
  return (
    <div>
      <TopBar title="TOUCHLINE" subtitle="Skill development tracker" />
      <div className="p-4">
        <div className="flex rounded-xl overflow-hidden border mb-5" style={{ borderColor: "rgba(11,61,98,0.15)" }}>
          {["squad", "player"].map((t) => (
            <button
              key={t}
              onClick={() => setTab(t)}
              className="flex-1 py-3 text-sm font-semibold tracking-wide flex items-center justify-center gap-2 transition-colors"
              style={{
                background: tab === t ? TOKENS.turf : TOKENS.chalk,
                color: tab === t ? TOKENS.chalk : TOKENS.turf,
              }}
            >
              {t === "squad" ? <Users size={16} /> : <UserRound size={16} />}
              {t === "squad" ? "By squad" : "By player"}
            </button>
          ))}
        </div>

        {tab === "squad" ? (
          <div className="space-y-3">
            <p className="text-xs uppercase tracking-widest font-semibold" style={{ color: TOKENS.turf, opacity: 0.6 }}>
              Choose a squad
            </p>
            {SQUADS.map((sq) => (
              <button
                key={sq}
                onClick={() => onOpenSquad(sq)}
                className="w-full flex items-center justify-between rounded-xl px-4 py-4 border transition-transform active:scale-[0.98]"
                style={{ borderColor: "rgba(11,61,98,0.15)", background: "#fff" }}
              >
                <div className="text-left">
                  <div className="font-display font-bold text-lg" style={{ color: TOKENS.turf }}>{sq}</div>
                  <div className="text-xs mt-0.5" style={{ color: "#6B7C8C" }}>
                    {NAMES.filter((n) => n.category === sq).length} players · {SKILLS_BY_CATEGORY[sq].length} core skills
                  </div>
                </div>
                <ChevronRight size={20} style={{ color: TOKENS.amber }} />
              </button>
            ))}
          </div>
        ) : (
          <div className="space-y-2">
            <p className="text-xs uppercase tracking-widest font-semibold mb-3" style={{ color: TOKENS.turf, opacity: 0.6 }}>
              All players
            </p>
            {NAMES.map((p, idx) => (
              <button
                key={idx}
                onClick={() => onOpenPlayer(`p${idx}`)}
                className="w-full flex items-center justify-between rounded-xl px-4 py-3 border transition-transform active:scale-[0.98]"
                style={{ borderColor: "rgba(11,61,98,0.12)", background: "#fff" }}
              >
                <div className="flex items-center gap-3 text-left">
                  <div
                    className="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
                    style={{ background: TOKENS.turf, color: TOKENS.chalk }}
                  >
                    {p.name.split(" ").map((w) => w[0]).join("")}
                  </div>
                  <div>
                    <div className="font-semibold text-sm" style={{ color: TOKENS.turf }}>{p.name}</div>
                    <div className="text-xs" style={{ color: "#6B7C8C" }}>{p.category} · age {p.age}</div>
                  </div>
                </div>
                <ChevronRight size={18} style={{ color: "#B9C6D1" }} />
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Squad detail screen ---------------- */

function SquadDetail({ squad, players, onBack, onOpenPlayer }) {
  const roster = players.filter((p) => p.category === squad);
  const skills = SKILLS_BY_CATEGORY[squad];

  return (
    <div>
      <TopBar title={`${squad} squad`} subtitle={`${roster.length} players`} onBack={onBack} />
      <div className="p-4 space-y-6">
        <div>
          <p className="text-xs uppercase tracking-widest font-semibold mb-2" style={{ color: TOKENS.turf, opacity: 0.6 }}>
            Skills to master
          </p>
          <div className="flex flex-wrap gap-2">
            {skills.map((s) => (
              <span
                key={s}
                className="text-xs font-medium px-3 py-1.5 rounded-full border"
                style={{ borderColor: "rgba(11,61,98,0.2)", color: TOKENS.turf, background: "#fff" }}
              >
                {s}
              </span>
            ))}
          </div>
        </div>

        <div>
          <p className="text-xs uppercase tracking-widest font-semibold mb-2" style={{ color: TOKENS.turf, opacity: 0.6 }}>
            Roster
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {roster.map((p) => {
              const avg =
                Object.values(p.scores).reduce((a, s) => a + s.value, 0) / Object.values(p.scores).length;
              return (
                <button
                  key={p.id}
                  onClick={() => onOpenPlayer(p.id)}
                  className="rounded-xl border p-4 text-left transition-transform active:scale-[0.98]"
                  style={{ borderColor: "rgba(11,61,98,0.12)", background: "#fff" }}
                >
                  <div className="flex items-center justify-between mb-2">
                    <div className="font-semibold text-sm" style={{ color: TOKENS.turf }}>{p.name}</div>
                    <span
                      className="text-[10px] font-bold px-2 py-0.5 rounded-full"
                      style={{ background: levelFor(Math.round(avg)).color, color: "#fff" }}
                    >
                      {levelFor(Math.round(avg)).short}
                    </span>
                  </div>
                  <div className="text-xs mb-2" style={{ color: "#6B7C8C" }}>age {p.age}</div>
                  <SegmentBar value={Math.round(avg)} />
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Player detail screen ---------------- */

function PlayerDetail({ player, onBack, onScoreChange, onAddFeedback }) {
  const [editingSkill, setEditingSkill] = useState(null);
  const [note, setNote] = useState("");
  const skills = SKILLS_BY_CATEGORY[player.category];

  return (
    <div>
      <TopBar title={player.name} subtitle={`${player.category} · age ${player.age}`} onBack={onBack} />
      <div className="p-4 space-y-6">
        <div>
          <p className="text-xs uppercase tracking-widest font-semibold mb-2" style={{ color: TOKENS.turf, opacity: 0.6 }}>
            Skills
          </p>
          <div className="space-y-2">
            {skills.map((skill) => {
              const rec = player.scores[skill];
              const lvl = levelFor(rec.value);
              const isEditing = editingSkill === skill;
              return (
                <div key={skill} className="rounded-xl border overflow-hidden" style={{ borderColor: "rgba(11,61,98,0.12)", background: "#fff" }}>
                  <button
                    onClick={() => setEditingSkill(isEditing ? null : skill)}
                    className="w-full flex items-center justify-between px-4 py-3"
                  >
                    <div className="text-left flex-1 min-w-0 mr-3">
                      <div className="font-semibold text-sm truncate" style={{ color: TOKENS.turf }}>{skill}</div>
                      <div className="mt-2"><SegmentBar value={rec.value} /></div>
                    </div>
                    <span
                      className="text-xs font-bold px-2.5 py-1 rounded-full shrink-0"
                      style={{ background: lvl.color, color: "#fff" }}
                    >
                      {lvl.label}
                    </span>
                  </button>

                  {isEditing && (
                    <div className="px-4 pb-4 pt-1 border-t" style={{ borderColor: "rgba(11,61,98,0.08)" }}>
                      <p className="text-[11px] font-semibold uppercase tracking-wide mt-3 mb-2" style={{ color: "#6B7C8C" }}>
                        Set new score
                      </p>
                      <div className="grid grid-cols-4 gap-2">
                        {LEVELS.map((l) => (
                          <button
                            key={l.value}
                            onClick={() => {
                              onScoreChange(player.id, skill, l.value);
                              setEditingSkill(null);
                            }}
                            className="rounded-lg py-2 text-xs font-semibold flex flex-col items-center gap-1 border transition-colors"
                            style={{
                              borderColor: l.value === rec.value ? l.color : "rgba(11,61,98,0.15)",
                              background: l.value === rec.value ? l.color : "#fff",
                              color: l.value === rec.value ? "#fff" : TOKENS.turf,
                            }}
                          >
                            {l.value === rec.value && <Check size={12} />}
                            {l.label}
                          </button>
                        ))}
                      </div>

                      {rec.history.length > 0 && (
                        <div className="mt-3 space-y-1">
                          <p className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: "#6B7C8C" }}>
                            History
                          </p>
                          {rec.history.slice().reverse().map((h, i) => (
                            <div key={i} className="flex items-center gap-2 text-xs" style={{ color: "#6B7C8C" }}>
                              <Clock size={11} />
                              <span>{h.date} — scored {levelFor(h.value).label}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <p className="text-xs uppercase tracking-widest font-semibold mb-2" style={{ color: TOKENS.turf, opacity: 0.6 }}>
            Game feedback
          </p>
          <div className="rounded-xl border p-4" style={{ borderColor: "rgba(11,61,98,0.12)", background: "#fff" }}>
            <textarea
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="What stood out this game? What should they focus on next?"
              rows={3}
              className="w-full text-sm rounded-lg border p-3 outline-none resize-none"
              style={{ borderColor: "rgba(11,61,98,0.15)" }}
            />
            <button
              onClick={() => {
                if (!note.trim()) return;
                onAddFeedback(player.id, note.trim());
                setNote("");
              }}
              className="mt-2 flex items-center gap-2 text-sm font-semibold px-3 py-2 rounded-lg transition-transform active:scale-[0.97]"
              style={{ background: TOKENS.turf, color: TOKENS.chalk }}
            >
              <MessageSquarePlus size={15} /> Add feedback
            </button>

            {player.feedback.length > 0 && (
              <div className="mt-4 space-y-3">
                {player.feedback.slice().reverse().map((f, i) => (
                  <div key={i} className="pl-3 border-l-2" style={{ borderColor: TOKENS.amber }}>
                    <div className="text-[11px] font-semibold" style={{ color: "#6B7C8C" }}>{f.date}</div>
                    <div className="text-sm mt-0.5" style={{ color: TOKENS.turf }}>{f.note}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="rounded-xl p-4 flex gap-3 items-start" style={{ background: "rgba(242,169,59,0.12)" }}>
          <ShieldHalf size={18} style={{ color: TOKENS.amber }} className="shrink-0 mt-0.5" />
          <p className="text-xs leading-relaxed" style={{ color: TOKENS.turf }}>
            Focus next: skills sitting at <strong>Introducing</strong> or <strong>Developing</strong> are the priority
            for next session. Scores update instantly here — in the full build, this write goes through the
            permissioned API so only this player's coaches and admins can change it.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Root app ---------------- */

function TouchlineApp() {
  const [players, setPlayers] = useState(makePlayers);
  const [screen, setScreen] = useState("landing");
  const [tab, setTab] = useState("squad");
  const [selectedSquad, setSelectedSquad] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [cameFrom, setCameFrom] = useState("landing");

  const handleScoreChange = (playerId, skill, newValue) => {
    setPlayers((prev) =>
      prev.map((p) => {
        if (p.id !== playerId) return p;
        const rec = p.scores[skill];
        if (rec.value === newValue) return p;
        return {
          ...p,
          scores: {
            ...p.scores,
            [skill]: {
              value: newValue,
              history: [...rec.history, { value: rec.value, date: today() }],
            },
          },
        };
      })
    );
  };

  const handleAddFeedback = (playerId, note) => {
    setPlayers((prev) =>
      prev.map((p) =>
        p.id === playerId ? { ...p, feedback: [...p.feedback, { date: today(), note }] } : p
      )
    );
  };

  const openSquad = (sq) => {
    setSelectedSquad(sq);
    setScreen("squad");
  };

  const openPlayer = (id, from) => {
    setSelectedPlayerId(id);
    setCameFrom(from || screen);
    setScreen("player");
  };

  const selectedPlayer = players.find((p) => p.id === selectedPlayerId);

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: "#EDF1F5" }}>
      <div className="w-full max-w-md min-h-screen shadow-xl" style={{ background: TOKENS.chalk }}>
        {screen === "landing" && (
          <Landing
            tab={tab}
            setTab={setTab}
            onOpenSquad={openSquad}
            onOpenPlayer={(id) => openPlayer(id, "landing")}
          />
        )}
        {screen === "squad" && (
          <SquadDetail
            squad={selectedSquad}
            players={players}
            onBack={() => setScreen("landing")}
            onOpenPlayer={(id) => openPlayer(id, "squad")}
          />
        )}
        {screen === "player" && selectedPlayer && (
          <PlayerDetail
            player={selectedPlayer}
            onBack={() => setScreen(cameFrom === "squad" ? "squad" : "landing")}
            onScoreChange={handleScoreChange}
            onAddFeedback={handleAddFeedback}
          />
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TouchlineApp />);
</script>
</body>
</html>
